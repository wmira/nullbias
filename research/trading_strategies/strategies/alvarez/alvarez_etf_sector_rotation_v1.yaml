strategy_id: alvarez_etf_sector_rotation_v1
name: "ETF Sector Rotation (Counter-Intuitive Middle-Rank)"
author: Cesar Alvarez

source:
  type: blog_post
  title: "Sector Rotation Strategy: Should Trading Rules Make Sense?"
  chapter_or_url: "https://alvarezquanttrading.com/blog/sector-rotation-strategy-should-trading-rules-make-sense/"
  publication_year: 2017
  page_or_section: NOT_SPECIFIED

# === STRATEGY METADATA ===
category: momentum
sub_category: sector_rotation_anti_top_rank
asset_class: [etfs]
specific_instruments: "US sector SPDR ETFs: XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, plus optional XLRE, XLC"
timeframe: monthly
holding_period_typical: "1 month"
direction: long_only

# === UNIVERSE & FILTERS ===
universe_definition: "US sector SPDR ETFs (9 to 11 names depending on the inclusion of XLRE/XLC)"
liquidity_filter: "Implicit — all SPDR sector ETFs are highly liquid"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    On the last trading day of each month at the close:
    1. For each sector ETF compute total return over the prior 6 months:
       return_6m = (close / close[126]) - 1
    2. Rank ETFs descending by return_6m (rank 1 = best, rank N = worst)
    3. Buy the ETFs at ranks 4, 5, 6 (the middle three of 9 sectors)
       — counter-intuitively NOT the top three.
    4. Equal-weight at next session's open.
  indicators_used:
    - name: ROC
      lookback_period: 126
      formula_reference: "(close[t] / close[t-126]) - 1"
      applied_to: close
  entry_price: market_open_next_bar
  entry_time: "First trading day of new month at open"

# === POSITION SIZING ===
position_sizing:
  method: equal_weight
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 33.33   # 100% / 3 names
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: none
  max_concurrent_positions: 3

# === EXIT RULES ===
exit_rules:
  profit_target: None
  stop_loss: None
  time_stop: "Re-rank monthly; rotate"
  trailing_stop: None
  signal_reversal: "Per-month re-evaluation"
  exit_priority: "Time stop only"
  exit_price: market_open_next_bar

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: "Optional: skip month if SPY < SMA(SPY, 200) at EOM"
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: "Always 3 different sectors by definition"

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [close]
  data_frequency: daily
  minimum_history_required: "126 bars per ETF"
  benchmark: "Equal-weighted sector ETFs or SPY"
  starting_capital: 100000
  commission_assumption: "$0 retail"
  slippage_assumption: "5 bps per fill"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Approximately 2007–2017 in original post"
  test_universe: "9 SPDR sector ETFs"
  cagr: "Author reports the middle-rank version had best CAR"
  sharpe: "Best Sharpe also for middle-rank version"
  max_dd: NOT_SPECIFIED
  win_rate: NOT_SPECIFIED
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: NOT_SPECIFIED
  notes: |
    The post's stated lesson: traditional momentum (buy ranks 1,2,3) had the
    WORST returns; ranks 4,5,6 had best. Author treats this as a cautionary
    note about whether trading rules need to 'make sense' a priori.

# === KNOWN VARIATIONS ===
variations:
  - "Top 3 (canonical momentum) — performs poorly per post"
  - "Bottom 3 (mean-reversion variant) — author also tested"
  - "Use 3-month or 12-month return instead of 6"
  - "Add SPY 200-SMA regime filter"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Author's published test uses 9 SPDR sector ETFs. Modern set may include
    XLRE (added 2015) and XLC (added 2018); their addition affects
    ranks 4/5/6 mechanically. Document the universe used.
  - The 'middle three' rule presupposes 9 names; if the universe size
    changes, the rule must be redefined (e.g., always pick the middle
    third of the ranked list).
look_ahead_bias_warnings: "EOM signal, next-session open fill — clean."
survivorship_bias_warnings: "Sector ETFs are stable; minor for XLRE/XLC inception dates."
data_snooping_warnings: |
  - This is a strong example of curve-fit risk. The 'middle three' choice
    was discovered by ranking all combinations after the fact. Author's
    own framing in the post acknowledges this — include the documentation
    in any deployment.

# === RELATED STRATEGIES ===
related_strategy_ids:
  - alvarez_country_etf_rotation_v1
  - alvarez_three_factor_etf_rotation_v1
prerequisites: None
