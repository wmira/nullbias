strategy_id: alvarez_simple_meanrev_v1
name: "Simple Ideas for a Mean Reversion Strategy"
author: Cesar Alvarez

source:
  type: blog_post
  title: "Simple Ideas for a Mean Reversion Strategy with Good Results"
  chapter_or_url: "https://alvarezquanttrading.com/blog/simple-ideas-for-a-mean-reversion-strategy-with-good-results/"
  publication_year: 2017
  page_or_section: NOT_SPECIFIED

# === STRATEGY METADATA ===
category: mean_reversion
sub_category: oversold_pullback_with_volatility_rank
asset_class: [equities]
specific_instruments: "S&P 500 stocks"
timeframe: daily
holding_period_typical: "3–7 trading days"
direction: long_only

# === UNIVERSE & FILTERS ===
universe_definition: |
  Stocks in S&P 500 (point-in-time) with:
  - close > $5
  - 21-day average dollar volume > $10M
liquidity_filter: "21-day avg(close*volume) > $10M"
fundamental_filter: "S&P 500 inclusion"
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    All at the close of bar t:
    1. SPY close > SMA(SPY.close, 200)
    2. close(t) > SMA(close, 200)
    3. RSI(close, 2)[t] < 5
    4. No position already open

    If more than 20 candidates qualify, rank by 100-day historical
    volatility descending and take the top 20.

    Use simple maximum-position model: up to 20 positions × 10% of equity each
    (i.e., the strategy can be 200% invested, leveraged via cash equity).
  indicators_used:
    - name: SMA (SPY)
      lookback_period: 200
      formula_reference: simple
      applied_to: "close (SPY)"
    - name: SMA
      lookback_period: 200
      formula_reference: simple
      applied_to: close
    - name: RSI
      lookback_period: 2
      formula_reference: "Wilder's smoothing"
      applied_to: close
    - name: realized_volatility
      lookback_period: 100
      formula_reference: "stdev of daily returns over 100 days × sqrt(252)"
      applied_to: returns
  entry_price: market_open_next_bar
  entry_time: "Next-day open"

# === POSITION SIZING ===
position_sizing:
  method: fixed_pct_equity
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 10
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: "Up to 20 concurrent (200% invested if all slots filled)"
  max_concurrent_positions: 20

# === EXIT RULES ===
exit_rules:
  profit_target: "Exit at next open after RSI(close, 2) > 65"
  stop_loss: None
  time_stop: "8 bars (next open after 8 bars in trade)"
  trailing_stop: None
  signal_reversal: None
  exit_priority: "Profit target first; time stop second"
  exit_price: market_open_next_bar

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: "SPY 200-SMA hard gate"
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: NOT_SPECIFIED

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [open, high, low, close, volume]
  data_frequency: daily
  minimum_history_required: "200 bars + 100 bars HV"
  benchmark: "SPY buy-and-hold"
  starting_capital: 100000
  commission_assumption: "$0 retail"
  slippage_assumption: "5–10 bps"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Approximately 2007–2017"
  test_universe: "S&P 500"
  cagr: "Author reports CAR > 20% with the 200% invested cap"
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: NOT_SPECIFIED
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: NOT_SPECIFIED
  notes: "200% invested is the source of high CAR; un-leveraged version produces lower returns."

# === KNOWN VARIATIONS ===
variations:
  - "Cap at 100% invested (10 positions × 10%)"
  - "Cap at 20 positions × 5% each (still 100% invested)"
  - "Use ConnorsRSI < 10 instead of RSI(2) < 5"
  - "Add limit-order entry instead of market-open"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - 200% invested means the strategy can use margin in live trading;
    in cash account simulations, cap at 100%.
  - HV ranking ties broken by alphabetical ticker (deterministic).
  - Day-of-overflow handling: if more than 20 signals fire on the same
    day, rank ALL signals by HV descending and take top 20; do not
    'fill remaining slots tomorrow' — that introduces look-ahead.
look_ahead_bias_warnings: "Use of next-day open avoids end-of-day fill issues."
survivorship_bias_warnings: "Material — point-in-time S&P 500 required."
data_snooping_warnings: "Default thresholds are author's; sweep robustness."

# === RELATED STRATEGIES ===
related_strategy_ids:
  - alvarez_abc_meanrev_v1
  - alvarez_rsi2_rule_change_v1
  - connors_rsi2_v1
prerequisites: None
