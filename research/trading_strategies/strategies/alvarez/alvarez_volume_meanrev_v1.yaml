strategy_id: alvarez_volume_meanrev_v1
name: "Volume + Mean Reversion Overlay"
author: Cesar Alvarez

source:
  type: blog_post
  title: "Volume and Mean Reversion"
  chapter_or_url: "https://alvarezquanttrading.com/blog/volume-and-mean-reversion/"
  publication_year: 2017
  page_or_section: NOT_SPECIFIED

# === STRATEGY METADATA ===
category: mean_reversion
sub_category: oversold_with_volume_spike
asset_class: [equities]
specific_instruments: "S&P 500 stocks"
timeframe: daily
holding_period_typical: "3–7 trading days"
direction: long_only

# === UNIVERSE & FILTERS ===
universe_definition: |
  Stocks meeting:
  - S&P 500 membership (point-in-time)
  - close > $5
  - 21-day avg dollar volume > $10M
  - close > SMA(close, 200)
liquidity_filter: "Standard $10M dollar-volume filter"
fundamental_filter: "S&P 500 inclusion"
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    All at the close of bar t:
    1. close(t) > SMA(close, 200)
    2. RSI(close, 2)[t] < 5
    3. volume(t) > 1.5 * SMA(volume, 21)[t]      (volume spike on the down day)
    4. No position already open

    Optional: limit order at close(t) * 0.96 for day t+1 (per Alvarez's
    canonical entry-timing pattern). If using market entry, fill at
    next-day open instead.
  indicators_used:
    - name: SMA
      lookback_period: 200
      formula_reference: simple
      applied_to: close
    - name: RSI
      lookback_period: 2
      formula_reference: "Wilder's smoothing"
      applied_to: close
    - name: SMA
      lookback_period: 21
      formula_reference: simple
      applied_to: volume
  entry_price: "Limit at 0.96 * close(t) for day t+1, OR market_open_next_bar"
  entry_time: "Intraday or next-open per chosen variant"

# === POSITION SIZING ===
position_sizing:
  method: equal_weight_pct_equity
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 10
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: none
  max_concurrent_positions: 10

# === EXIT RULES ===
exit_rules:
  profit_target: "Exit at next open after RSI(close, 2) > 65"
  stop_loss: None
  time_stop: "8 bars (next open after 8 bars in trade)"
  trailing_stop: None
  signal_reversal: None
  exit_priority: "Profit target first; time stop second"
  exit_price: market_open_next_bar

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: "Per-stock 200-SMA"
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: NOT_SPECIFIED

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [open, high, low, close, volume]
  data_frequency: daily
  minimum_history_required: "200 bars (SMA) + 21 bars (volume avg)"
  benchmark: "SPY buy-and-hold"
  starting_capital: 100000
  commission_assumption: "$0 retail"
  slippage_assumption: "5–10 bps"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Approximately 2007–2017"
  test_universe: "S&P 500"
  cagr: "Author reports the volume filter improves trade quality but reduces trade count"
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: "Higher than RSI(2) alone"
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: "Materially lower than RSI(2) baseline due to volume gating"
  notes: NOT_SPECIFIED

# === KNOWN VARIATIONS ===
variations:
  - "Volume threshold 1.25x or 2.0x instead of 1.5x"
  - "Use 50-day SMA of volume instead of 21-day"
  - "Apply volume filter to ConnorsRSI variant instead of RSI(2)"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Volume comparison is against rolling 21-day SMA of daily share volume.
    Some implementations use dollar volume — note difference.
  - Excluding bar t from the average (i.e., comparing today's volume to
    the prior-21-day average, not including today) is more rigorous;
    default to that.
look_ahead_bias_warnings: "Volume on bar t is known by close-of-day; signal is fully ex-ante."
survivorship_bias_warnings: "Material — point-in-time S&P 500 required."
data_snooping_warnings: "1.5x threshold is heuristic."

# === RELATED STRATEGIES ===
related_strategy_ids:
  - alvarez_simple_meanrev_v1
  - alvarez_rsi2_rule_change_v1
  - connors_rsi2_v1
prerequisites: None
