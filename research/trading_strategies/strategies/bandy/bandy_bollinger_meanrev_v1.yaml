strategy_id: bandy_bollinger_meanrev_v1
name: "Bandy Bollinger Band Mean Reversion"
author: Howard Bandy

source:
  type: book
  title: "Mean Reversion Trading Systems"
  chapter_or_url: "Bollinger band chapter"
  publication_year: 2013
  page_or_section: "Bollinger chapter"

# === STRATEGY METADATA ===
category: mean_reversion
sub_category: bollinger_band_extreme_deviation
asset_class: [equities, etfs]
specific_instruments: "Liquid US equity ETFs and stocks"
timeframe: daily
holding_period_typical: "1-3 days"
direction: long_only

# === UNIVERSE & FILTERS ===
universe_definition: "Liquid ETFs and stocks"
liquidity_filter: "Adequate volume"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Daily evaluation:
    1. close(t) > SMA(close, 200)
    2. close(t) < lower_bollinger(close, 20, 2)
       Bollinger Bands: mid = SMA(close, 20); lower = mid - 2 * stdev(close, 20)
    3. No position currently open
  indicators_used:
    - name: SMA
      lookback_period: 200
      formula_reference: simple
      applied_to: close
    - name: SMA
      lookback_period: 20
      formula_reference: simple
      applied_to: close
    - name: rolling_stdev
      lookback_period: 20
      formula_reference: "Sample standard deviation; ddof=1"
      applied_to: close
  entry_price: close_signal_bar
  entry_time: "End-of-day"

# === POSITION SIZING ===
position_sizing:
  method: fixed_pct_equity
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 100
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: none
  max_concurrent_positions: 1

# === EXIT RULES ===
exit_rules:
  profit_target: "Exit when close > SMA(close, 20) (Bollinger mid-band)"
  stop_loss: None
  time_stop: "3-5 bars"
  trailing_stop: None
  signal_reversal: None
  exit_priority: "Mid-band cross → time stop"
  exit_price: close_signal_bar

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: "200-SMA"
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: NOT_SPECIFIED

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [close]
  data_frequency: daily
  minimum_history_required: "200 bars"
  benchmark: "SPY"
  starting_capital: 100000
  commission_assumption: "$0 retail"
  slippage_assumption: "5 bps"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Pre-2013"
  test_universe: "ETFs and stocks"
  cagr: NOT_SPECIFIED
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: NOT_SPECIFIED
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: NOT_SPECIFIED
  notes: "Standard 20×2 Bollinger configuration vs Connors' unusual 5×1. More conventional, fewer signals."

# === KNOWN VARIATIONS ===
variations:
  - "5-period × 1-stdev (Connors-style)"
  - "10-period × 1.5-stdev (intermediate)"
  - "Add RSI(2) confirmation filter"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - 20×2 is the textbook Bollinger; Bandy generally uses standard
    configurations rather than custom-tuned ones.
look_ahead_bias_warnings: "Standard."
survivorship_bias_warnings: "Material on stocks."
data_snooping_warnings: "Few tunables."

# === RELATED STRATEGIES ===
related_strategy_ids:
  - connors_pct_b_v1
  - chan_bollinger_meanrev_v1
  - bandy_zscore_meanrev_v1
prerequisites: None
