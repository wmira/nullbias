# === KNOWN VARIATIONS ===
variations:
  - "Anchored walk-forward (always use all prior history)"
  - "Sliding walk-forward (fixed-length IS window)"
  - "Multi-objective optimization (Sharpe + drawdown constraint)"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - IS/OOS lengths and step sizes are choices; sliding 5-year IS / 1-year
    OOS / 1-year step is the canonical Bandy default.
  - Walk-forward overlay is a META method — apply to any other
    strategy in the index.
look_ahead_bias_warnings: "WFO is specifically designed to eliminate look-ahead — but only if implemented strictly (no peeking at OOS during IS optimization)."
survivorship_bias_warnings: "Per underlying."
data_snooping_warnings: |
  - Walk-forward DOES reduce look-ahead bias but does NOT eliminate
    multiple-testing bias when many parameter combinations are tested.
  - Final OOS Sharpe is itself subject to selection bias if many
    strategies are walk-forwarded and only the best is kept.

