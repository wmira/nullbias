name: "Walk-Forward Optimization Methodology Overlay"
author: Howard Bandy

source:
  type: book
  title: "Quantitative Trading Systems / Modeling Trading System Performance"
  chapter_or_url: "Walk-forward chapters"
  publication_year: 2007
  page_or_section: "Walk-forward chapters across both books"

# === STRATEGY METADATA ===
category: factor
sub_category: validation_methodology_overlay
asset_class: [equities, etfs, futures]
specific_instruments: "Any underlying strategy with tunable parameters"
timeframe: daily
holding_period_typical: "N/A — methodology"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Defined by the underlying strategy"
liquidity_filter: NOT_SPECIFIED
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    OVERLAY METHODOLOGY — applied to any parameterised strategy.

    1. Define strategy parameters (e.g., RSI threshold, lookback windows,
       exit conditions).
    2. Define optimization criterion (typically Sharpe ratio or
       expectancy).
    3. Walk-forward window structure:
         in_sample_length:  N years (typically 3-5)
         out_of_sample_length: M years (typically 1)
         step_size: M (advance by OOS length each iteration)
    4. For each window:
         a. Optimize parameters on the IS window
         b. Trade with optimal parameters on the OOS window
         c. Record OOS performance
    5. Concatenate OOS performance across all windows.

    The strategy is considered VIABLE only if OOS performance is
    materially positive — Bandy's threshold is OOS Sharpe > 0.7.

    WFE (Walk-Forward Efficiency) ratio:
      WFE = OOS_Sharpe / IS_Sharpe
    Bandy's heuristic: WFE > 0.5 indicates the optimization isn't
    over-fit; lower WFE means in-sample tuning doesn't generalize.
  indicators_used:
    - name: walk_forward_optimizer
      lookback_period: "Configurable"
      formula_reference: |
        Standard walk-forward CV: split history into N IS/OOS windows,
        optimize on each IS, evaluate on each OOS, concatenate OOS results.
        scikit-learn TimeSeriesSplit provides comparable functionality.
      applied_to: "any parameter-search strategy"
  entry_price: per_underlying_strategy
  entry_time: per_underlying_strategy

