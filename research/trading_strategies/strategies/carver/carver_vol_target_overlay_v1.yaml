# === UNIVERSE & FILTERS ===
universe_definition: "Defined by the underlying strategies feeding into this overlay"
liquidity_filter: "Per-strategy"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    This is an OVERLAY: it sits on top of a forecasting trading rule (e.g.,
    EWMAC or carry) and converts a continuous forecast into a contract count.

    Inputs (computed or chosen):
      - capped_forecast: from the underlying rule, range ±20
      - cash_volatility_target: e.g., 25% of equity annualised
      - portfolio_value: current cash equity
      - instrument_value_per_contract: contract price × multiplier × FX
      - instrument_vol_pct_annualised: stdev of daily returns × sqrt(256)
      - IDM (instrument diversification multiplier): function of inter-instrument
        forecast correlation. For Carver's 30-instrument system ≈ 2.5.
      - FDM (forecast diversification multiplier): function of forecast
        correlation across rules. For 8 rules ≈ 1.4.
      - instrument_weight: e.g., 1/N for N instruments (or risk-parity weighted)
      - forecast_weight: weight of this rule in the combined forecast

    Step 1 — Cash daily volatility target:
        daily_vol_target = portfolio_value × cash_volatility_target / 16
        (16 ≈ sqrt(256) for daily annualisation)

    Step 2 — Risk capital per instrument:
        per_inst_risk = daily_vol_target × instrument_weight × IDM

    Step 3 — Volatility scalar (number of avg-position-size blocks):
        vol_scalar = per_inst_risk
                   / (instrument_value_per_contract × instrument_vol_pct / 16)

    Step 4 — Subsystem position (avg position when combined forecast = 10):
        subsystem_position = vol_scalar × FDM × forecast_weight × instrument_weight

    Step 5 — Scale by current forecast:
        target_contracts = subsystem_position × (combined_forecast / 10)

    Step 6 — Round to integer contracts (with a buffer to avoid over-trading):
        if |actual_contracts - target_contracts| > buffer ⇒ rebalance
        else hold

    Position direction:
      Long if combined_forecast > 0; short if < 0.
  indicators_used:
    - name: realised_volatility
      lookback_period: 25
      formula_reference: "Stdev of daily returns × sqrt(256). Carver's pysystemtrade uses an adjusted estimator combining 25-day and 10-year averages."
      applied_to: returns
  entry_price: close_signal_bar
  entry_time: "Continuous; rebalance when |actual - target| > buffer"

