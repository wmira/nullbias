variations:
  - "Different volatility-target levels (10%, 25%, 50%)"
  - "Risk-parity instrument weights instead of equal weight"
  - "Hand-crafted instrument weights (Carver's preferred method per blog)"
  - "Drawdown-conditional vol scaling"
  - "Cash equity-curve smoothing for the equity input"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Annualisation factor: Carver uses 16 (≈ sqrt(256)) where 256 is
    trading days. Some implementations use 252 / sqrt(252) ≈ 15.87.
  - IDM and FDM are EMPIRICAL. They need to be re-estimated whenever
    instruments or rules change.
  - The buffer rule is critical for cost control; without it, daily
    rebalancing kills returns through churn.
  - Vol estimator: Carver's framework uses an adjusted blend of
    short-term (25 day) and long-term (10 year) volatility to reduce
    sensitivity to recent shocks.
look_ahead_bias_warnings: "Vol estimator uses CURRENT bar close — fine for end-of-day execution; live trading must reconcile."
survivorship_bias_warnings: "Per-strategy."
data_snooping_warnings: |
  - IDM and FDM constants estimated in-sample. Re-estimating OOS is
    essential for honest performance assessment.
  - Vol target (25%) is the user's risk choice, not an optimised
    parameter.

