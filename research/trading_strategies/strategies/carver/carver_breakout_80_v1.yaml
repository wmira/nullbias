strategy_id: carver_breakout_80_v1
name: "Breakout(80) — Slow Donchian-Style Channel Breakout"
author: Robert Carver

source:
  type: blog_post
  title: "A simple breakout trading rule (pysystemtrade)"
  chapter_or_url: "https://qoppac.blogspot.com/2016/05/a-simple-breakout-trading-rule.html ; pysystemtrade GitHub `breakout` rule"
  publication_year: 2016
  page_or_section: NOT_SPECIFIED

# === STRATEGY METADATA ===
category: trend_following
sub_category: channel_breakout
asset_class: [futures]
specific_instruments: "Diversified futures universe"
timeframe: daily
holding_period_typical: "Weeks to months; ~3× per year turnover"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Diversified futures"
liquidity_filter: "Looser cost filter than fast breakout"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Same structure as carver_breakout_20_v1 with N=80:

    1. roll_max = max(close[t-79..t])
    2. roll_min = min(close[t-79..t])
    3. roll_mid = (roll_max + roll_min) / 2
    4. raw_position = (close[t] - roll_mid) / (roll_max - roll_min)
    5. smoothed_position = EWMA(raw_position, span=20)        # span = N/4 = 20
    6. forecast = smoothed_position × forecast_scalar
       forecast_scalar (Breakout 80) ≈ 30
    7. capped_forecast = clip(forecast, -20, +20)
  indicators_used:
    - name: rolling_max
      lookback_period: 80
      formula_reference: "max(close) over last 80 bars (inclusive)"
      applied_to: close
    - name: rolling_min
      lookback_period: 80
      formula_reference: "min(close) over last 80 bars (inclusive)"
      applied_to: close
    - name: EWMA
      lookback_period: 20
      formula_reference: "ewm(span=20)"
      applied_to: "raw breakout position series"
  entry_price: close_signal_bar
  entry_time: "Continuous"

# === POSITION SIZING ===
position_sizing:
