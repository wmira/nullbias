    Author created this rule specifically to add diversification to an
    EWMAC-only trend system. Performs well during sideways-to-breakout
    transitions where EWMAC is whipsawed.

# === KNOWN VARIATIONS ===
variations:
  - "Breakout(10), (40), (80), (160), (320) — different speeds"
  - "Without smoothing — pure binary signal"
  - "Use high/low instead of close for max/min"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Channel inclusive of bar t — so on the entry bar, price equals max
    or min, signal is at extreme.
  - Forecast scalar 30 is the empirical value; actual scalar depends on
    instrument volatility distribution.
  - Smoothing span = N/4 is Carver's documented heuristic.
look_ahead_bias_warnings: "Same as EWMAC family — close-of-day signal."
survivorship_bias_warnings: "Negligible."
data_snooping_warnings: "Channel length and smoothing-span ratio are choices; multiple speeds tested."

