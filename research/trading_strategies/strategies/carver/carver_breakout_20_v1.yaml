strategy_id: carver_breakout_20_v1
name: "Breakout(20) — Fast Donchian-Style Channel Breakout"
author: Robert Carver

source:
  type: blog_post
  title: "A simple breakout trading rule (pysystemtrade)"
  chapter_or_url: "https://qoppac.blogspot.com/2016/05/a-simple-breakout-trading-rule.html ; pysystemtrade GitHub `breakout` rule"
  publication_year: 2016
  page_or_section: NOT_SPECIFIED

# === STRATEGY METADATA ===
category: trend_following
sub_category: channel_breakout
asset_class: [futures]
specific_instruments: "Diversified futures universe"
timeframe: daily
holding_period_typical: "Days to weeks; ~12× per year turnover"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Diversified futures contracts"
liquidity_filter: "Cost-per-trade filter (similar to EWMAC(4,16))"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Continuous-forecast rule based on price position within rolling channel.

    1. roll_max = max(close[t-N+1..t]) over N=20 days
    2. roll_min = min(close[t-N+1..t]) over N=20 days
    3. roll_mid = (roll_max + roll_min) / 2
    4. raw_position = (close[t] - roll_mid) / (roll_max - roll_min)
       (range-normalised; lies in [-0.5, +0.5])
    5. smoothed_position = EWMA(raw_position, span=N/4)        # i.e., span=5
    6. forecast = smoothed_position × forecast_scalar
       forecast_scalar (Breakout 20) ≈ 30
    7. capped_forecast = clip(forecast, -20, +20)

    Long when smoothed > 0; short when smoothed < 0.
  indicators_used:
    - name: rolling_max
      lookback_period: 20
      formula_reference: "max(close) over last 20 bars (inclusive)"
      applied_to: close
    - name: rolling_min
      lookback_period: 20
      formula_reference: "min(close) over last 20 bars (inclusive)"
      applied_to: close
    - name: EWMA
      lookback_period: 5
      formula_reference: "ewm(span=5) on the raw breakout position"
      applied_to: "raw breakout position series"
  entry_price: close_signal_bar
  entry_time: "Continuous"

# === POSITION SIZING ===
position_sizing:
  method: volatility_targeted_continuous_forecast
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: "Function of forecast"
    volatility_target: "User-defined"
    atr_multiple: NOT_SPECIFIED
    forecast_scalar: 30.0
    forecast_cap: 20.0
  scaling_rules: "Continuous"
  max_concurrent_positions: "All instruments"

# === EXIT RULES ===
