  max_dd: NOT_SPECIFIED
  win_rate: NOT_SPECIFIED
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: "~3 round-trips per instrument per year"
  notes: |
    Carver describes EWMAC(16,64) as the 'sweet spot' speed for trend
