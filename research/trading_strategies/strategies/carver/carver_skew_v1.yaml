# === KNOWN VARIATIONS ===
variations:
  - "180-day skew (faster)"
  - "Realised-vol-conditioned skew ('skewK_abs_90')"
  - "Cross-asset rank-based skew (no normalisation, just rank)"
  - "Combine with kurtosis as a related rule"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Skewness convention: Pearson moment (centered, normalised by σ³).
    Pandas default uses bias-adjusted Fisher-Pearson; statsmodels.tsa
    has options. Document the chosen library/parameter.
  - Cross-sectional demean: optional but improves Sharpe in Carver's
    tests. Default to demeaned for the v1.
  - Sign of forecast: NEGATIVE skew is bullish (long). Easy to invert by
    accident.
look_ahead_bias_warnings: "Skew computed over closed window of 365 bars; no leakage."
survivorship_bias_warnings: "Negligible (futures with proper roll handling)."
data_snooping_warnings: "Skew rule has demonstrably weaker performance OOS than the carry/EWMAC family."

