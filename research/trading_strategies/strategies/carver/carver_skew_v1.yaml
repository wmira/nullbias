  chapter_or_url: "https://qoppac.blogspot.com/2020/01/skew-and-kurtosis-as-trading-rules.html and /2019/02/skew-and-trend-following.html ; AFTS Strategy 25"
  publication_year: 2020
  page_or_section: NOT_SPECIFIED

# === STRATEGY METADATA ===
category: factor
sub_category: realized_skew
asset_class: [futures]
specific_instruments: "Diversified futures universe"
timeframe: daily
holding_period_typical: "Months — very low turnover"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Diversified futures with sufficient history (≥365 daily returns)"
liquidity_filter: "Standard cost filter"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Continuous-forecast rule based on realised skewness of returns.

    1. Compute daily returns: r[t] = (close[t] / close[t-1]) - 1
    2. realised_skew = skewness(r[t-364..t]) over a 365-day rolling window
       (Pearson moment skewness; scipy.stats.skew or pandas .skew())
    3. Sign convention: SHORT positively-skewed assets, LONG negatively-skewed
       (rationale: assets with negative skew earn risk premium for tail risk)
    4. raw_signal = -realised_skew
    5. Normalise across cross-section (optional but recommended in Carver's
       writing): subtract the cross-sectional mean of -skew across all
       instruments.
    6. forecast = (raw_signal − cross_sectional_mean) × forecast_scalar
       forecast_scalar empirically ≈ 60 (Carver's calibration for span=365)
    7. capped_forecast = clip(forecast, -20, +20)

    Long when negatively skewed (forecast > 0 by sign-flip).
    Short when positively skewed.
  indicators_used:
    - name: realised_skewness
      lookback_period: 365
      formula_reference: "Pearson moment skewness of daily returns: E[((r-mean)/sigma)^3]. Pandas: returns.rolling(365).skew()"
      applied_to: returns
  entry_price: close_signal_bar
  entry_time: "Continuous"

