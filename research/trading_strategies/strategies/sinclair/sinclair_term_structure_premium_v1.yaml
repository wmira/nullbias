timeframe: weekly
holding_period_typical: "Weeks"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Index options with rich term structure (multiple expirations); VIX futures complex"
liquidity_filter: "Tight bid-ask across expirations"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Trade slope of the IV term structure based on VRP per maturity.

    Method:
    1. Compute IV at multiple maturities (e.g., 30d, 60d, 90d, 180d).
    2. Compute IV slope: typically (IV_long - IV_short) / sqrt(time_diff).
    3. Compare slope to historical distribution.

    Key trades:
    A) Curve normalisation:
       When term structure is unusually inverted (short-dated IV > long-dated IV),
       SHORT short-dated options (overpriced) and LONG long-dated options
       (underpriced relative to term structure norm).

    B) Calendar spread (short premium variant):
       When implied term-structure slope is steeper than RV term-structure slope
       (typically the case), short the over-priced front-month and long
       under-priced back-month.

    C) VIX futures basis:
       When VIX < VX1 (front future) materially, buy VIX exposure (via VXX
       or front-month VIX future). When inverted, short.

    Sinclair's edge: short-dated options generally have HIGHER VRP than
    long-dated, so calendar shorts (short front, long back) capture this
    premium.
  indicators_used:
    - name: implied_volatility_term_structure
      lookback_period: 1
      formula_reference: "ATM IV at multiple expirations from option chain"
      applied_to: "option chain"
    - name: VIX_futures_basis
      lookback_period: 1
      formula_reference: "VX1 (front future) - VIX (spot)"
      applied_to: "VIX complex"
  entry_price: market_or_limit
  entry_time: "Weekly evaluation; entry on signal"

