fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Strategic baseline allocation harvesting equity, term, credit,
    inflation, and commodity premia. Adjusted by momentum signals.

    Step 1 — Baseline weights (risk-parity inspired):
      Allocate inversely to long-run volatility:
        weight_i = (1 / vol_i_5yr) / sum(1 / vol_j_5yr)
      Adjust to user-defined risk budget per asset class.

    Step 2 — Momentum overlay (Robot Wealth's adjustment):
      Compute 12-month total return per asset
      Adjust baseline weight by ±20% based on relative momentum:
        Top-third assets: weight × 1.2
        Bottom-third assets: weight × 0.8
        Middle-third: weight × 1.0
      Renormalise to sum to 1.

    Step 3 — Rebalance monthly (or quarterly).
  indicators_used:
    - name: long_run_volatility
      lookback_period: 1260  # 5 years
      formula_reference: "stdev daily returns × sqrt(252)"
      applied_to: returns
    - name: 12_month_return
      lookback_period: 252
      formula_reference: "(close[t] / close[t-252]) - 1"
      applied_to: close
  entry_price: market_open_next_bar
  entry_time: "First trading day of new month"

# === POSITION SIZING ===
position_sizing:
  method: risk_parity_with_momentum_tilt
  parameters:
