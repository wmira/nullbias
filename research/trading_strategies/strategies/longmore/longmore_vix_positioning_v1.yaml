# === STRATEGY METADATA ===
category: volatility
sub_category: vix_term_structure_positioning
asset_class: [etfs]
specific_instruments: "VIX index, VXX/VIXY (long vol), SVXY (-0.5x short vol), VIX futures"
timeframe: daily
holding_period_typical: "Days to weeks"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "VIX-related ETFs and futures"
liquidity_filter: "VXX is highly liquid; SVXY moderate"
fundamental_filter: NOT_SPECIFIED
exclusions: "XIV no longer trades (delisted Feb 2018)"

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Position based on VIX term-structure shape:

    1. Compute VX1 (front future) / VIX (spot) ratio.
    2. If ratio > 1.05 (contango): SHORT vol via SVXY long
       OR sell VIX call spreads.
    3. If ratio < 0.98 (backwardation): LONG vol via VXX
       OR buy VIX call spreads.
    4. Optional: scale position by ratio magnitude.

    Sinclair-equivalent overlay: Robot Wealth's bootcamp version
    emphasises position-sizing discipline — vol ETFs can move 30%+
    in a day.
  indicators_used:
    - name: VX1_VIX_ratio
      lookback_period: 1
      formula_reference: "front month VIX future / VIX spot"
      applied_to: "VIX complex"
  entry_price: close_signal_bar
  entry_time: "End-of-day"

# === POSITION SIZING ===
position_sizing:
  method: vol_targeted
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 15
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: "Smaller than equity positions due to vol-product extreme moves"
  max_concurrent_positions: 1

# === EXIT RULES ===
exit_rules:
  profit_target: None
  stop_loss: "20% adverse move on VXX/SVXY"
  time_stop: NOT_SPECIFIED
  trailing_stop: None
  signal_reversal: "Term-structure flip"
  exit_priority: "Stop → reversal"
  exit_price: close_signal_bar

# === RISK MANAGEMENT ===
