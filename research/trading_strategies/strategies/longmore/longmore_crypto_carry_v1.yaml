  - "Term-structure-aware (extrapolate funding curve)"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Funding interval differs by exchange (Binance 8hr, Hyperliquid 1hr).
  - Annualisation: funding × intervals_per_year.
  - Delta-hedge requires both perp account AND spot account; capital
    inefficiency.
look_ahead_bias_warnings: "Funding paid retrospectively; use funding rate KNOWN at evaluation time."
survivorship_bias_warnings: "Material — many alt-coin perps have been delisted."
data_snooping_warnings: "Cross-section size and rebalance frequency tunable."

