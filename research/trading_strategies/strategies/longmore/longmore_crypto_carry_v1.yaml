# === STRATEGY METADATA ===
category: factor
sub_category: crypto_perp_funding_carry
asset_class: [crypto]
specific_instruments: "Perpetual futures on Binance, Hyperliquid, Bybit, etc. (BTC, ETH, SOL, and major alts)"
timeframe: daily
holding_period_typical: "Days to weeks"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Liquid crypto perpetual futures across major venues"
liquidity_filter: "Adequate volume; tight bid-ask"
fundamental_filter: NOT_SPECIFIED
exclusions: "Skip illiquid alts during high vol"

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Crypto perpetual futures have funding rates that compensate for
    the divergence of perp price from spot. Funding rate is paid
    every 8 hours (Binance), 1 hour (Hyperliquid), etc.

    Carry trade:
    1. For each perp, observe funding rate F (annualised).
    2. Across the cross-section of perps:
       - LONG perps with NEGATIVE funding (you receive funding)
       - SHORT perps with POSITIVE funding (you receive funding)
    3. Hedge each leg with spot (delta-neutral) so you collect funding
       without directional exposure:
       - For LONG perp: short equivalent spot
       - For SHORT perp: long equivalent spot

    Alternative simplified version (no hedge):
    - Long perps with most-negative funding
    - Short perps with most-positive funding
    - Accept some directional risk

    Sinclair-style take: funding rate IS the futures basis; this is
    a carry trade in the most literal sense.
  indicators_used:
    - name: funding_rate
      lookback_period: 1
      formula_reference: "Exchange-published funding rate per perp; annualise by multiplying by funding intervals per year"
      applied_to: "perpetual futures"
    - name: cross_sectional_rank_of_funding
      lookback_period: 1
      formula_reference: "Rank perps by current funding rate across universe"
      applied_to: "funding rate cross-section"
  entry_price: market_at_close
  entry_time: "Daily evaluation; rebalance when ranks shift materially"

