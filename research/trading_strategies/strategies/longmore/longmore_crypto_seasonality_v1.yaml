# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Statistical significance threshold (p < 0.05) doesn't survive
    Bonferroni for multi-position testing — many calendar positions
    means high false-discovery rate.
  - Crypto's short history limits sample sizes; OOS rigour is critical.
look_ahead_bias_warnings: "Calendar known in advance; no look-ahead."
survivorship_bias_warnings: "Material on alt coins."
data_snooping_warnings: "Severe — many calendar positions tested implicitly."

