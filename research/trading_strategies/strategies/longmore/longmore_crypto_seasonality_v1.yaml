# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Documented patterns in crypto markets:

    A) Day-of-week effect:
       Returns are systematically different on certain weekdays
       (e.g., Mondays positive in some periods).

    B) Time-of-day effect (crypto trades 24/7):
       Returns concentrated in certain hour-bands (US/Asia overlap, etc.)

    C) Halving-cycle effect:
       BTC has 4-year halving cycles; returns concentrated in
       certain phases.

    D) Holiday / Lunar New Year effect:
       Asian holidays correlate with reduced volume / different behaviour.

    Trade rule template:
    1. Compute average return over last 5+ years for each calendar
       position (day-of-week, hour, week-of-year).
    2. Identify positions with statistically significant non-zero
       average return (t-test p < 0.05).
    3. ENTER LONG at positions with significant positive avg return.
    4. ENTER SHORT at positions with significant negative avg return.
    5. EXIT at end of position window.
  indicators_used:
    - name: rolling_seasonal_mean_return
      lookback_period: "5+ years"
      formula_reference: "Mean return at each calendar position over prior years"
      applied_to: returns
    - name: t_test
      lookback_period: "5+ years"
      formula_reference: "One-sample t-test against null of zero mean"
      applied_to: "calendar-grouped returns"
  entry_price: close_signal_bar
  entry_time: "Calendar-driven"

