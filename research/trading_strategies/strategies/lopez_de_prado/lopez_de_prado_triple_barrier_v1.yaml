  notes: |
    Triple-barrier creates labels that match what a trader actually
    cares about (profit hit before loss) — not just final return at
    a fixed horizon. Works much better as ML training target than
    fixed-horizon return signs.

# === KNOWN VARIATIONS ===
variations:
  - "Side-aware labeling: incorporate primary model's side prediction"
  - "Asymmetric barriers (different α and β)"
  - "Path-dependent barriers (e.g., trailing-stop variant)"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - σ_t (volatility) estimation: daily-bar std vs Garman-Klass vs
    EWMA all valid; document choice.
  - Vertical time barrier: typical 5-21 bars; longer barriers reduce
    label noise but also reduce trading frequency.
  - Implementation: mlfinlab Python library has reference code.
look_ahead_bias_warnings: "When generating labels for ML training, ALL barriers must be evaluated only with information available at entry; future price path is the LABEL, not the input."
survivorship_bias_warnings: "Per underlying."
data_snooping_warnings: "α and β multiples are tunable; sweep robustness."

