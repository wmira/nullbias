# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    LABELING METHODOLOGY for supervised ML on time series.

    For each entry timestamp t (event), compute the label by tracking
    forward price action against THREE barriers:

    1. Upper barrier (profit target):
         pt = entry_price × (1 + α × σ_t)
         where σ_t = volatility-adapted target (typically rolling
         daily std × sqrt(holding_days))
         α = e.g., 2 (target = 2σ above entry)

    2. Lower barrier (stop loss):
         sl = entry_price × (1 - β × σ_t)
         β = e.g., 2

    3. Time barrier (vertical):
         expiry_t = t + N bars (e.g., 5 days)

    Track price path forward from t. Label = sign of which barrier
    is hit first:
      +1 if upper barrier hit first    (profit signal)
      -1 if lower barrier hit first    (loss signal)
       0 if time barrier hit first     (no signal)

    Use these labels as targets for ML supervised learning.
    Replaces fixed-horizon "sign of next-N-day return" labels.
  indicators_used:
    - name: rolling_volatility
      lookback_period: 252
      formula_reference: "EWMA stdev of daily returns; or Garman-Klass volatility from OHLC"
      applied_to: returns
    - name: vertical_time_barrier
      lookback_period: "User-defined (typically 5-21 days)"
      formula_reference: "Fixed bar count from entry"
      applied_to: NOT_APPLICABLE
  entry_price: per_underlying_strategy
  entry_time: "Event timestamps from primary signal"

