  time_stop: per_primary_strategy
  trailing_stop: None
  signal_reversal: NOT_SPECIFIED
  exit_priority: per_primary_strategy
  exit_price: per_primary_strategy

# === RISK MANAGEMENT ===
portfolio_level_rules:
