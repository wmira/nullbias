# === KNOWN VARIATIONS ===
variations:
  - "Different classifiers (logistic, RF, GBM, neural net)"
  - "Different threshold values (0.5, 0.6, 0.7)"
  - "Stacked meta-labelers (meta-meta-labeling)"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Train/test split must respect time ordering (no shuffling).
  - Use purged CV for proper OOS evaluation (Lopez de Prado Chapter 7).
  - Class imbalance is common (most labels are 0); use class_weight or
    SMOTE-style balancing carefully.
look_ahead_bias_warnings: |
  - Triple-barrier labels reach into the FUTURE relative to the event.
    This is fine for training but the model must NOT use future-derived
    features at inference time.
  - Beware of feature contamination via windowed indicators that
    include future data.
survivorship_bias_warnings: "Per universe."
data_snooping_warnings: |
  - Threshold and feature-set selection are themselves subject to
    multiple-testing bias. Use proper purged + embargoed CV.

