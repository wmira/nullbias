strategy_id: lopez_de_prado_meta_labeling_v1
name: "Meta-Labeling — Secondary ML Model on Primary Signals"
author: Marcos López de Prado

source:
  type: book
  title: "Advances in Financial Machine Learning"
  chapter_or_url: "Chapter 3 (Labeling) — meta-labeling section"
  publication_year: 2018
  page_or_section: "Chapter 3.6"

# === STRATEGY METADATA ===
category: factor
sub_category: ml_signal_filtering_overlay
asset_class: [equities, etfs, futures]
specific_instruments: "Any underlying primary signal source"
timeframe: daily
holding_period_typical: "N/A — overlay"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Defined by primary model"
liquidity_filter: NOT_SPECIFIED
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Two-stage ML pipeline:

    Stage 1 — Primary model:
      Existing strategy that produces a SIDE prediction (long, short, flat)
      Examples: any strategy in this index — connors_rsi2_v1, EWMAC,
      pairs trading, etc. Or an ML classifier that predicts direction.

    Stage 2 — Meta-labeling secondary model:
      For each event where primary model fires:
        a. Compute features (price, volume, technical indicators, etc.)
        b. Apply triple-barrier labeling on subsequent price path:
             label = 1 if profit barrier hit first (primary was right)
             label = 0 if loss or time barrier hit first
        c. Train binary classifier: features → label
      In live use:
        meta_score_t = secondary_model.predict_proba(features_t)
      Take primary signal ONLY if meta_score > threshold (e.g., 0.6)

    Net effect: keep primary's SIZE / DIRECTION decisions; meta-model
    decides WHEN to act on them.

    Benefit: improves precision (fewer false positives) at cost of recall.
    Sharpe-improving even at the cost of fewer trades.
  indicators_used:
    - name: primary_signal
      lookback_period: per_strategy
      formula_reference: "Output of any underlying strategy in the index"
      applied_to: per_strategy
    - name: triple_barrier_labels
      lookback_period: "5-21 bars forward"
      formula_reference: "See lopez_de_prado_triple_barrier_v1"
      applied_to: forward_price_path
    - name: ml_classifier
      lookback_period: "Training set: ALL prior events"
      formula_reference: "Any binary classifier (RandomForest, GBM, neural net) trained on (features, triple_barrier_labels)"
      applied_to: features_at_event
  entry_price: per_primary_strategy
  entry_time: "Same as primary, but only when meta_score above threshold"

# === POSITION SIZING ===
position_sizing:
  method: meta_score_scaled
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: NOT_SPECIFIED
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: "Optional: scale position size by meta_score (higher confidence = larger position)"
  max_concurrent_positions: per_primary_strategy

# === EXIT RULES ===
