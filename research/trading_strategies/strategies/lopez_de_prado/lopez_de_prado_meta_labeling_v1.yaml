  required_data_fields: per_primary
  data_frequency: per_primary
  minimum_history_required: "Sufficient labelled events to train classifier (e.g., 500+ events)"
  benchmark: "Primary model alone (without meta-labeling)"
  starting_capital: NOT_SPECIFIED
  commission_assumption: "Per primary"
  slippage_assumption: "Per primary"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Demonstrated in book"
  test_universe: "Various"
  cagr: NOT_SPECIFIED
  sharpe: "Improves Sharpe of primary model materially in book examples"
  max_dd: NOT_SPECIFIED
  win_rate: "Increased vs primary alone"
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: "Decreased — only act on high-confidence meta-scores"
  notes: |
    The meta-model can use ANY features (technical indicators, market
    regime variables, news sentiment). Author emphasises feature
