# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    EVENT-BASED SAMPLING method to identify SIGNIFICANT price moves
    while ignoring noise.

    Algorithm:
    1. Track cumulative deviation from a reference price:
         S_high = max(0, S_high_prev + (price_t - price_{t-1}))
         S_low  = min(0, S_low_prev + (price_t - price_{t-1}))
    2. Trigger an EVENT when |cumulative deviation| > threshold h
       (typically h = 2 × daily volatility)
    3. On event:
         If S_high >= h: positive event (significant up-move)
         If S_low <= -h: negative event (significant down-move)
         Reset both S_high and S_low to 0
    4. Output: list of event timestamps where significant moves
       occurred. Use these as entry-point candidates for an ML
       model (instead of every bar).

    Used in conjunction with triple-barrier labeling and meta-labeling
    to focus ML training on meaningful events, not all bars (which
    are mostly noise).
  indicators_used:
    - name: cumulative_deviation_S_high
      lookback_period: "Recursive"
      formula_reference: "S_high_t = max(0, S_high_{t-1} + (P_t - P_{t-1})); reset to 0 on event"
      applied_to: close
    - name: cumulative_deviation_S_low
      lookback_period: "Recursive"
      formula_reference: "S_low_t = min(0, S_low_{t-1} + (P_t - P_{t-1})); reset to 0 on event"
      applied_to: close
    - name: rolling_volatility_threshold
      lookback_period: 100
      formula_reference: "EWMA of daily returns × sqrt(scale); threshold h = e.g. 2 × this"
      applied_to: returns
  entry_price: per_underlying_ml_strategy
  entry_time: "On event triggers (subset of all bars)"

