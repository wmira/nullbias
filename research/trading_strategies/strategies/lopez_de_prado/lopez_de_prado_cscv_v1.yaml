strategy_id: lopez_de_prado_cscv_v1
name: "Combinatorially Symmetric Cross-Validation (CSCV) for Backtest Overfit Detection"
author: Marcos López de Prado

source:
  type: paper
  title: "The Probability of Backtest Overfitting"
  chapter_or_url: "SSRN paper; Advances in Financial Machine Learning Chapter 11-12"
  publication_year: 2014
  page_or_section: "Chapters 11-12"

# === STRATEGY METADATA ===
category: factor
