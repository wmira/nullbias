# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Methodology to estimate the PROBABILITY OF BACKTEST OVERFITTING (PBO).

    Procedure:
    1. Generate N parameter configurations of a strategy (e.g., 10,000
       combinations of moving-average periods, RSI thresholds, etc.).
    2. Compute trade-by-trade returns for each configuration on full
       history → matrix M of size T (timestamps) × N (configurations).
    3. Split T into S non-overlapping submatrices of equal length
       (S typically 16).
    4. For all C(S, S/2) ways to partition the S sub-matrices into
       half "in-sample" and half "out-of-sample":
         a. Concatenate IS sub-matrices for each configuration
         b. Concatenate OOS sub-matrices for each configuration
         c. Identify n* = arg max IS Sharpe (the "best" config in IS)
         d. Compute OOS Sharpe rank of n* among all N configs
         e. Record relative rank ω̄_n* = OOS_rank / N
    5. PBO = Pr(ω̄ < median) = fraction of partitions where the IS-best
       config performed below median OOS.

    Interpretation:
      PBO < 0.5 → IS optimization generalises (low overfit)
      PBO > 0.5 → IS-best is no better than random in OOS (overfit)

    Use as a HARD CRITERION for whether to deploy a strategy.
  indicators_used:
    - name: cscv_partition_search
      lookback_period: "Full history"
      formula_reference: "Combinatorial enumeration of S/2 from S sub-matrices; O(2^S) — manageable for S≤20"
      applied_to: "configuration × time matrix of returns"
  entry_price: per_underlying_strategy
  entry_time: per_underlying_strategy

