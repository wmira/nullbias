# === KNOWN VARIATIONS ===
variations:
  - "Different S values (8, 16, 32) — bigger S more thorough, more compute"
  - "Sample-based PBO (random subsampling instead of full combinatorial)"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - S=16 → C(16, 8) = 12,870 partitions; tractable.
  - S=20 → C(20, 10) = 184,756 partitions; pushing.
  - For very large parameter spaces, use random subset of partitions.
look_ahead_bias_warnings: "Strict IS/OOS split per partition; no look-ahead."
survivorship_bias_warnings: "Per underlying."
data_snooping_warnings: |
  - CSCV is specifically designed to MEASURE data-snooping effects;
    it doesn't eliminate them, just quantifies their severity.

