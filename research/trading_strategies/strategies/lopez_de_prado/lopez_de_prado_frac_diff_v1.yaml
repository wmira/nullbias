# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Feature engineering technique. Replaces integer differentiation
    (returns, log returns) which DESTROYS price-level memory, with
    fractional differentiation that preserves more memory while
    achieving stationarity.

    Method (Fixed-Width Window form, FFD):

    1. Choose differencing parameter d ∈ (0, 1):
       d = 0   →  raw price (full memory, non-stationary)
       d = 1   →  first difference / return (no memory, stationary)
       d = 0.4 →  some memory + stationary (typical sweet spot)

    2. Compute weights:
         w_0 = 1
         w_k = -w_{k-1} × (d - k + 1) / k    (recursive)
       Truncate when |w_k| < tolerance (e.g., 1e-5)

    3. Apply weighted convolution:
         frac_diff[t] = sum over k from 0 to K of w_k × series[t-k]

    4. Test stationarity (ADF test):
         If p-value < 0.05: stationary, use this d
         Else: increase d slightly, retry
       Find the SMALLEST d such that the series is stationary
       (preserves maximum memory).

    5. Use frac_diff[t] as ML feature (instead of raw price or return).
  indicators_used:
    - name: fractional_differentiation
      lookback_period: "Truncated when weights drop below threshold"
      formula_reference: |
        Recursive weights w_k computed as above; convolution applied
        over rolling window. Implementations:
        - mlfinlab.features.fracdiff
        - tsfracdiff Python package
        - Custom implementation per book Chapter 5
      applied_to: "log price or raw price"
    - name: ADF_test
      lookback_period: "Full frac_diff series"
      formula_reference: "Augmented Dickey-Fuller test for stationarity"
      applied_to: "frac_diff series"
  entry_price: per_underlying_strategy
