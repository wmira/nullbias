# === KNOWN VARIATIONS ===
variations:
  - "NR7 (narrowest of last 7 bars) — see raschke_nr7_v1"
  - "ID/NR7 (inside day + 7-bar narrowest)"
  - "Apply on weekly charts for swing trades"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - 'NR4' = today's range is strictly less than each of the prior 3
    bars' ranges. Some sources define as 'narrowest of last 4 bars
    inclusive of today' — same result.
  - Bracket orders (buy stop above, sell stop below) require broker
    support; otherwise place orders sequentially and cancel the
    unused one when the first fires.
look_ahead_bias_warnings: "Stop entries — true forward-looking."
survivorship_bias_warnings: "Material on stocks."
data_snooping_warnings: "NR4 is a common pattern; works on many timeframes."

