# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - SMA construction is what differentiates 3-10 from MACD; user must
    NOT substitute EMAs.
  - 'First cross' is mechanical: track signal-line zero-crossings and
    only trade the oscillator's first cross-back-through-signal after
    each zero-cross.
