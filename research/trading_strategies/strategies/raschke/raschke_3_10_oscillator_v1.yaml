# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Indicator construction:
    - oscillator = SMA(close, 3) - SMA(close, 10)
    - signal_line = SMA(oscillator, 16)

    Note: 3-10 uses SIMPLE moving averages, distinguishing it from
    standard MACD which uses EMAs.

    LONG entry — 'first cross' setup:
    1. signal_line crosses ABOVE zero (intermediate trend just turned up)
    2. oscillator crosses ABOVE signal_line, then HOOKS back down briefly
    3. oscillator hooks back UP through signal_line again
    4. Buy at the close of the bar where the second up-cross happens, OR
       enter on stop above the signal bar's high.

    SHORT entry — symmetric:
    1. signal_line crosses BELOW zero (intermediate trend turned down)
    2. oscillator crosses BELOW signal_line, hooks up briefly, then back
       down

    Conceptually identical to The Anti pattern but using Raschke's
    proprietary oscillator instead of stochastic.
  indicators_used:
    - name: SMA
      lookback_period: 3
      formula_reference: "Simple 3-period MA of close"
      applied_to: close
    - name: SMA
      lookback_period: 10
      formula_reference: "Simple 10-period MA of close"
      applied_to: close
    - name: SMA_of_oscillator
      lookback_period: 16
      formula_reference: "Simple 16-period MA of (SMA3 - SMA10)"
      applied_to: "oscillator series"
  entry_price: market_at_close_or_stop
  entry_time: "End-of-bar fill at close, OR stop entry next bar"

