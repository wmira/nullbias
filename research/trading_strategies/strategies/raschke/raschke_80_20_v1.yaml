strategy_id: raschke_80_20_v1
name: "80-20 Pattern — Day-After Range-Extreme Close Reversal"
author: Linda Raschke

source:
  type: book
  title: "Street Smarts"
  chapter_or_url: "80-20 chapter; with Larry Connors"
  publication_year: 1995
  page_or_section: "80-20s chapter"

# === STRATEGY METADATA ===
category: mean_reversion
sub_category: range_extreme_close_reversal
asset_class: [equities, futures, etfs]
specific_instruments: "Liquid daily-chart instruments"
timeframe: daily
holding_period_typical: "1-3 days"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Liquid stocks, futures, ETFs"
liquidity_filter: "Adequate volume"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Setup at bar t:

    LONG setup (downside-extreme reversal):
    1. open(t) ≥ high(t) - 0.20 × (high(t) - low(t))
       (today opened in the TOP 20% of the day's range)
    2. close(t) ≤ low(t) + 0.20 × (high(t) - low(t))
       (today CLOSED in the BOTTOM 20% of the day's range)
    3. So: opened high, closed low — strong reversal day

    Execution at bar t+1:
    4. Place buy stop at: low(t) + 5-15 ticks (just above today's low)
    5. Wait for next bar to trade BELOW today's low FIRST, then reverse
       and break the buy-stop level
    6. Order valid for 1 day; fill only if intraday low(t+1) < low(t)
       AND intraday high(t+1) ≥ buy_stop

    SHORT setup — symmetric:
    1. open(t) in BOTTOM 20% of range
    2. close(t) in TOP 80% of range
    3. Sell-stop at high(t) - buffer; trigger requires next-day high to
       exceed today's high then reverse down through stop
  indicators_used:
    - name: bar_range_position
      lookback_period: 1
      formula_reference: "(close - low) / (high - low) for close position; same for open. Ratio thresholds 0.2 and 0.8."
      applied_to: high_low_open_close
  entry_price: stop_above_prior_low_or_below_prior_high
  entry_time: "Day t+1 intraday — only after price first breaks today's range extreme then reverses"

# === POSITION SIZING ===
position_sizing:
  method: fixed_pct_equity
  parameters:
    risk_per_trade_pct: 1
    max_position_pct: NOT_SPECIFIED
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: "Position = (equity × 1%) / stop distance"
  max_concurrent_positions: NOT_SPECIFIED

# === EXIT RULES ===
exit_rules:
  profit_target: "Prior session's open or close"
  stop_loss: "Beyond today's intraday low (long) or high (short)"
  time_stop: "Exit by close of t+2 if not stopped or at target"
  trailing_stop: NOT_SPECIFIED
  signal_reversal: NOT_SPECIFIED
  exit_priority: "Stop → time stop → target"
  exit_price: market_or_stop

# === RISK MANAGEMENT ===
