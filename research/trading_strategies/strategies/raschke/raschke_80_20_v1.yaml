# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Pre-1995"
  test_universe: "Futures, stocks"
  cagr: NOT_SPECIFIED
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: "Author claims 80-90% follow-through; ~50% of those continue to mid-day reversal"
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: "Few — full setup is rare"
  notes: "Pattern is rare but high probability when it triggers. Day trader's setup; modern markets may have different intraday dynamics."

# === KNOWN VARIATIONS ===
variations:
  - "70-30 (less strict cutoff)"
  - "Apply on 60-min instead of daily"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - 'Top 20% / bottom 20%' of day's range is the canonical version.
    Strict cutoff sometimes produces no signals for weeks.
  - The two-step trigger (price must first violate the prior bar's range
    extreme, then reverse to fill the entry stop) is what makes this
    high-probability — not just buying a strong reversal day.
look_ahead_bias_warnings: "Multi-step intraday trigger requires intraday data for accurate backtesting; daily-only OHLC will overstate fill rate."
survivorship_bias_warnings: "Material on stocks."
data_snooping_warnings: "Threshold values heuristic."

