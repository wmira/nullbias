strategy_id: raschke_nr7_v1
name: "NR7 — 7-Bar Narrowest Range Breakout"
author: Linda Raschke

source:
  type: book
  title: "Street Smarts"
  chapter_or_url: "NR7 chapter; with Larry Connors"
  publication_year: 1995
  page_or_section: "NR7 chapter"

# === STRATEGY METADATA ===
category: trend_following
sub_category: volatility_contraction_breakout_7bar
asset_class: [equities, futures, etfs]
specific_instruments: "Liquid daily-chart instruments"
timeframe: daily
holding_period_typical: "1-5 days"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Liquid stocks, futures, ETFs"
liquidity_filter: "Adequate volume"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Setup at bar t:
    1. range(t) is strictly less than each of range(t-1), range(t-2), ...
       range(t-6).
       (today's range is the narrowest of the last 7 bars)
       Equivalent: range(t) = min(range[t-6..t])

    Execution at bar t+1 (breakout):
    2. Buy stop at high(t) + 1 tick
    3. Sell stop at low(t) - 1 tick
    4. First stop fires; cancel the other.
    5. Order good for one day.

    Trade in the direction of the breakout — no counter-trend trading.
  indicators_used:
    - name: bar_range
      lookback_period: 1
      formula_reference: "high - low"
      applied_to: high_low
    - name: nr7_check
      lookback_period: 7
      formula_reference: "range(t) = min(range[t-6..t])"
      applied_to: "range series"
  entry_price: stop_above_or_below_setup_bar
  entry_time: "Day t+1 intraday — first stop hit"

# === POSITION SIZING ===
position_sizing:
  method: fixed_pct_equity
  parameters:
    risk_per_trade_pct: 1
    max_position_pct: NOT_SPECIFIED
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: "1% risk / stop distance"
  max_concurrent_positions: NOT_SPECIFIED

# === EXIT RULES ===
exit_rules:
  profit_target: "Optional: 2× setup bar range; or trail"
  stop_loss: "Opposite side of setup bar"
  time_stop: "5-bar time stop"
  trailing_stop: NOT_SPECIFIED
  signal_reversal: NOT_SPECIFIED
  exit_priority: "Stop → time stop → target"
  exit_price: market_or_stop

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: None
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: NOT_SPECIFIED

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [open, high, low, close]
  data_frequency: daily
  minimum_history_required: "7 bars"
  benchmark: "Cash"
