# =============================================================================
# Connors Cumulative RSI — sum of two-period RSI over two days
# =============================================================================

strategy_id: connors_cumulative_rsi_v1
name: "Cumulative RSI Strategy"
author: Larry Connors

source:
  type: book
  title: "Short Term Trading Strategies That Work"
  chapter_or_url: "Cumulative RSI chapter; with Cesar Alvarez"
  publication_year: 2008
  page_or_section: "Cumulative RSI chapter"

# === STRATEGY METADATA ===
category: mean_reversion
sub_category: oversold_pullback
asset_class: [equities, etfs]
specific_instruments: "SPY, QQQ, IWM and large-cap equities"
timeframe: daily
holding_period_typical: "2–6 trading days"
direction: long_only

# === UNIVERSE & FILTERS ===
universe_definition: "Liquid US equity ETFs and large-cap stocks"
liquidity_filter: NOT_SPECIFIED
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    All of the following must be true at the close of bar t:
    1. close(t) > SMA(close, 200) at bar t
    2. CumRSI_2(t) := RSI(close, 2)[t] + RSI(close, 2)[t-1]  < 35
       (canonical two-day cumulative threshold from book)
    3. No position currently open in this instrument
  indicators_used:
    - name: SMA
      lookback_period: 200
      formula_reference: simple
      applied_to: close
    - name: CumulativeRSI
      lookback_period: 2
      formula_reference: "Sum of standard 2-period RSI (Wilder smoothing) over the last 2 bars: RSI(2)_t + RSI(2)_(t-1)"
      applied_to: close
  entry_price: close_signal_bar
  entry_time: "End-of-day fill at close of bar t"

# === POSITION SIZING ===
position_sizing:
  method: fixed_pct_equity
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 100
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: none
  max_concurrent_positions: 1

# === EXIT RULES ===
exit_rules:
  profit_target: "Exit when RSI(close, 2) at bar t > 65"
  stop_loss: None
  time_stop: NOT_SPECIFIED
  trailing_stop: None
  signal_reversal: None
  exit_priority: "Single exit"
  exit_price: close_signal_bar

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: "200-SMA filter built into entry"
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: NOT_SPECIFIED

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [close]
  data_frequency: daily
  minimum_history_required: "200 bars + 30 bars for RSI(2) Wilder warmup"
  benchmark: "Buy-and-hold same ETF"
  starting_capital: 100000
  commission_assumption: "$0 (modern retail)"
  slippage_assumption: "5 bps MOC"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "1993–2008 (book era)"
  test_universe: "SPY and ETFs"
  cagr: NOT_SPECIFIED
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: "Author reports high win rates"
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: NOT_SPECIFIED
  notes: "Independent third-party tests have shown profit factors > 2 with thresholds in the 10–35 range across various ETFs."

# === KNOWN VARIATIONS ===
variations:
  - "Three-day cumulative: CumRSI_3 = sum of RSI(2) over t-2..t; threshold ~50"
  - "Stricter two-day threshold of < 15 — rarer signals, higher win rate"
  - "Exit at RSI(2) > 50 (more frequent exits)"
  - "Symmetric short side: close < 200-SMA AND CumRSI_2 > 165, cover at RSI(2) < 35"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - 'Cumulative' here means a simple sum (not running cumulative since
    inception). Window length = 2 days unless specified otherwise.
  - Threshold of 35 is the most-cited canonical value; variations exist.
look_ahead_bias_warnings: "Close-of-day signal — see RSI(2) note."
survivorship_bias_warnings: "Negligible (ETFs)."
data_snooping_warnings: "Threshold 35 vs 15 vs 10 has meaningful effect; sweep robustness."

# === RELATED STRATEGIES ===
related_strategy_ids:
  - connors_rsi2_v1
  - connors_r3_v1
  - connors_rsi25_75_v1
prerequisites: None
