# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - Choice of τ: longer τ tests longer-horizon mean reversion. Use
    multiple τ for robustness.
  - p-value thresholds 0.05 conventional; 0.10 for less strict.
  - Sample size matters — VR tests on <100 bars are unreliable.
