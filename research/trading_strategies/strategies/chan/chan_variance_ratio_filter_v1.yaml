# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    OVERLAY rule — provides STATISTICAL test of mean-reversion vs random
    walk vs trending behaviour.

    Variance Ratio (VR) statistic:

    For lag τ (typical τ = 2, 5, 10, 20):
      VR(τ) = Var[z_t - z_{t-τ}] / (τ × Var[z_t - z_{t-1}])
      where z_t = log price

    Interpretation:
      VR(τ) ≈ 1 → random walk (efficient)
      VR(τ) < 1 → mean-reverting (variance grows slower than τ)
      VR(τ) > 1 → trending (variance grows faster than τ)

    Statistical significance via Lo-MacKinlay test statistic which is
    approximately N(0, 1) under null of random walk.

    Application as overlay:
      Compute rolling VR(τ) over last 252 bars
      If VR < 0.95 AND p-value < 0.05 (significantly mean-reverting):
        enable mean-reversion strategies
      If VR > 1.05 AND p-value < 0.05 (significantly trending):
        enable trend-following strategies
      Else: hold cash / no new entries
  indicators_used:
    - name: variance_ratio
      lookback_period: 252
      formula_reference: "Lo-MacKinlay variance ratio test. Implementation: arch.unitroot.VarianceRatio (Python arch library)"
      applied_to: "log returns or log prices"
  entry_price: per_underlying_strategy
  entry_time: "Close-of-day evaluation"

