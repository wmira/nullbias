strategy_id: chan_pairs_johansen_v1
name: "Cointegration Baskets via Johansen Test"
author: Ernest Chan

source:
  type: book
  title: "Algorithmic Trading: Winning Strategies and Their Rationale"
  chapter_or_url: "Pairs trading chapters; epchan.blogspot.com posts"
  publication_year: 2013
  page_or_section: "Johansen test chapter"

# === STRATEGY METADATA ===
category: pairs
sub_category: cointegration_basket_johansen
asset_class: [equities, etfs]
specific_instruments: "Baskets of 3+ cointegrated equities or ETFs (e.g., 3-leg currency basket)"
timeframe: daily
holding_period_typical: "Days to weeks"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Baskets of N (typically 3-10) cointegrated assets within a sector or theme"
liquidity_filter: "All legs adequately liquid"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Step 1 — Johansen cointegration test:
      For each candidate basket of N assets:
      1. Run Johansen test on the price matrix (statsmodels.tsa.vector_ar.vecm.coint_johansen)
      2. Determine cointegration rank r based on trace and max-eigenvalue statistics
         vs critical values at chosen confidence (95%)
      3. If r >= 1: extract eigenvector w from the first cointegrating relation
      4. Compute spread: spread_t = Σ_i w_i × P_i,t  (linear combination
         using eigenvector weights)

    Step 2 — Daily trading:
      1. Compute current spread using w
      2. Rolling z-score over last N days (e.g., 20)
      3. Long basket (long w, scaled) when z < -2
      4. Short basket (short w, scaled) when z > +2
      5. Close when |z| < 0.5

    Advantage over Engle-Granger: Johansen treats all assets symmetrically,
    avoids dependence on choice of dependent variable, and explicitly
    tests for multiple cointegrating relationships.
  indicators_used:
    - name: Johansen_test
      lookback_period: 252
      formula_reference: "Johansen vector cointegration test. statsmodels.tsa.vector_ar.vecm.coint_johansen with det_order=0, k_ar_diff=1"
      applied_to: "price matrix of basket assets"
    - name: cointegrating_eigenvector
      lookback_period: 252
      formula_reference: "First column of v matrix from Johansen test (the eigenvector with largest eigenvalue)"
      applied_to: "Johansen test output"
    - name: rolling_zscore
      lookback_period: 20
      formula_reference: "Z-score of basket spread"
      applied_to: "spread series"
  entry_price: close_signal_bar
  entry_time: "End-of-day"

# === POSITION SIZING ===
position_sizing:
  method: weighted_basket_position
  parameters:
    risk_per_trade_pct: NOT_SPECIFIED
    max_position_pct: 10
    volatility_target: NOT_SPECIFIED
    atr_multiple: NOT_SPECIFIED
  scaling_rules: "Position in each leg proportional to eigenvector weight w_i; scaled to dollar-neutral overall"
  max_concurrent_positions: NOT_SPECIFIED

# === EXIT RULES ===
exit_rules:
  profit_target: "Close when |z| < 0.5"
  stop_loss: "Optional: |z| > 4"
  time_stop: NOT_SPECIFIED
  trailing_stop: None
  signal_reversal: NOT_SPECIFIED
  exit_priority: "Profit target on z-reversion"
  exit_price: close_signal_bar

# === RISK MANAGEMENT ===
portfolio_level_rules:
  max_drawdown_circuit_breaker: NOT_SPECIFIED
  market_regime_filter: "Periodic re-test of cointegration"
  correlation_limits: NOT_SPECIFIED
  sector_concentration_limits: NOT_SPECIFIED

# === BACKTEST REQUIREMENTS ===
backtest_specs:
  required_data_fields: [close]
  data_frequency: daily
  minimum_history_required: "252 bars per leg"
  benchmark: "Cash / market-neutral"
  starting_capital: 100000
  commission_assumption: "Per-share × N legs"
  slippage_assumption: "5-10 bps per leg"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Multi-year in book examples"
  test_universe: "Various baskets (currency, equity, sector ETFs)"
  cagr: "Modest standalone returns; advantage is statistical robustness vs 2-leg version"
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: NOT_SPECIFIED
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: NOT_SPECIFIED
  notes: "Chan recommends Johansen over Engle-Granger when cointegration is weak or when multi-asset baskets are involved."

# === KNOWN VARIATIONS ===
variations:
  - "Use second cointegrating relation (rank=2) for additional basket"
  - "Equal-weight basket (drop eigenvector weighting) — simpler but less optimal"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - statsmodels.tsa.vector_ar.vecm.coint_johansen is the standard
    Python implementation; det_order and k_ar_diff parameters affect
    result.
  - Eigenvector signs are ambiguous; use Chan's convention of sign-flipping
    so that weight on first asset is positive.
  - Re-estimate cointegration relationship periodically (monthly).
look_ahead_bias_warnings: "Re-estimate eigenvector OOS for honest backtest."
survivorship_bias_warnings: "Material on stock baskets."
data_snooping_warnings: "Multiple-testing bias when scanning many baskets."

# === RELATED STRATEGIES ===
related_strategy_ids:
