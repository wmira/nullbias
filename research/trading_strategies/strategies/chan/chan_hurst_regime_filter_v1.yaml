# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    OVERLAY rule — gates other strategies based on whether the series is
    in a mean-reverting or trending regime.

    Compute Hurst exponent H over a rolling window (typically 100-365 days):

    Method (rescaled-range R/S analysis):
    1. For a series x of length N, divide into chunks of varying sizes τ
    2. For each τ, compute mean of partial sums and the rescaled range:
         R(τ) = max(cumsum(x - mean)) - min(cumsum(x - mean))
         S(τ) = stdev(x)
         R/S(τ) = R(τ) / S(τ)
    3. Average R/S across chunks of size τ
    4. Fit log(avg R/S) vs log(τ): slope = H

    Interpretation:
      H < 0.5  → mean-reverting regime  → enable mean-reversion strategies
      H = 0.5  → random walk           → no edge; reduce or disable trading
      H > 0.5  → trending regime        → enable trend strategies

    Application as overlay:
      For each underlying, on each daily bar:
        rolling_H = compute Hurst over last 252 bars
        if rolling_H < 0.45: allow mean-reversion entries (e.g., chan_bollinger_meanrev_v1)
        if rolling_H > 0.55: allow trend-following entries
        else: hold cash or maintain neutral
  indicators_used:
    - name: Hurst_exponent
      lookback_period: 252
      formula_reference: "Rescaled-range R/S analysis. Implementations: nolds.hurst_rs, hurst.compute_Hc, custom R/S code"
      applied_to: "log returns or prices"
