# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - R/S analysis is the canonical Chan method but has known small-sample
    bias. Detrended Fluctuation Analysis (DFA) is more robust.
  - Threshold 0.5 ± 0.05 is a heuristic buffer; tighter buffers produce
    more frequent regime flips.
  - On very short windows (<100 bars) Hurst estimates are unreliable.
look_ahead_bias_warnings: "Use rolling H computed only from past data."
survivorship_bias_warnings: "Per underlying."
data_snooping_warnings: "Threshold and window choices are tunable."

