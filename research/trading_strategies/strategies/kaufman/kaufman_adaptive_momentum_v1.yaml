strategy_id: kaufman_adaptive_momentum_v1
name: "Adaptive Momentum (ER-Modulated Lookback)"
author: Perry Kaufman

source:
  type: book
  title: "Trading Systems and Methods"
  chapter_or_url: "Adaptive momentum chapter"
  publication_year: 1987
  page_or_section: "Adaptive momentum chapter"

# === STRATEGY METADATA ===
category: momentum
sub_category: adaptive_lookback_momentum
asset_class: [equities, etfs, futures]
specific_instruments: "Liquid instruments"
timeframe: daily
holding_period_typical: "Weeks"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Liquid daily instruments"
liquidity_filter: "Adequate volume"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    Momentum lookback adapts to ER:
    1. Compute base ER over 10 days.
    2. Adaptive lookback N:
         N = round(min_period + (max_period - min_period) × (1 - ER))
       e.g., min=10, max=60: high-ER (trending) → N≈10, low-ER (choppy) → N≈60
    3. Compute momentum: ROC = (close[t] / close[t-N]) - 1
    4. Long when ROC > 0; short when ROC < 0.

    Logic: in trending markets, fast momentum captures recent move;
    in choppy markets, slow momentum smooths out noise. Adaptive
    period combines both.
  indicators_used:
    - name: efficiency_ratio
      lookback_period: 10
      formula_reference: "Standard ER formula"
      applied_to: close
    - name: ROC
      lookback_period: "adaptive (10-60 based on ER)"
      formula_reference: "(close[t] / close[t-N_adaptive]) - 1"
      applied_to: close
  entry_price: close_signal_bar
  entry_time: "End-of-day"

# === POSITION SIZING ===
position_sizing:
