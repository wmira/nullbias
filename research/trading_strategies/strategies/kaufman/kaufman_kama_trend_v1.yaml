strategy_id: kaufman_kama_trend_v1
name: "KAMA Trend Following (Kaufman Adaptive Moving Average)"
author: Perry Kaufman

source:
  type: book
  title: "Smarter Trading: Improving Performance in Changing Markets"
  chapter_or_url: "KAMA chapter; Trading Systems and Methods (multiple editions) cross-references"
  publication_year: 1995
  page_or_section: "KAMA / Efficiency Ratio chapter"

# === STRATEGY METADATA ===
category: trend_following
sub_category: adaptive_moving_average_slope
asset_class: [equities, etfs, futures]
specific_instruments: "Liquid trending instruments"
timeframe: daily
holding_period_typical: "Weeks to months"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Any liquid daily-bar instrument"
liquidity_filter: "Adequate volume"
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    KAMA construction (Kaufman's recommended parameters: 10, 2, 30):

    1. Efficiency Ratio (ER):
         direction = abs(close[t] - close[t-10])
         volatility = sum of abs(close[k] - close[k-1]) for k in t-9..t
         ER = direction / volatility   (range 0 to 1)

    2. Smoothing Constant (SC):
         fastest_SC = 2 / (2 + 1)   = 2/3 = 0.6667
         slowest_SC = 2 / (30 + 1) = 2/31 ≈ 0.0645
         SC[t] = (ER[t] × (fastest_SC - slowest_SC) + slowest_SC)^2

    3. KAMA recursion:
         KAMA[t] = KAMA[t-1] + SC[t] × (close[t] - KAMA[t-1])
         Initial KAMA = SMA(close, 10)

    Trade rules — slope-based:
       LONG when KAMA[t] > KAMA[t-N] (N=1 default; 5 for less noise)
       SHORT when KAMA[t] < KAMA[t-N]
       Flat when KAMA is sideways (|KAMA[t] - KAMA[t-N]| < threshold)

    Optional ER gate:
       Only act when ER > 0.30 (trending environment).
       In choppy environments (ER low), KAMA flattens and signal is
       muted — but the strategy generates fewer trades in those
       periods, which is the point.
  indicators_used:
    - name: KAMA
      lookback_period: "(10, 2, 30)"
      formula_reference: "Kaufman Adaptive Moving Average. Implementation: TA-Lib has KAMA; pandas-ta.kama; or hand-rolled per formula above."
      applied_to: close
    - name: efficiency_ratio
      lookback_period: 10
      formula_reference: "ER = abs(close[t] - close[t-10]) / sum_of_abs_price_changes(10)"
      applied_to: close
  entry_price: close_signal_bar
  entry_time: "End-of-day"

# === POSITION SIZING ===
position_sizing:
