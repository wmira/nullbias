# === KNOWN VARIATIONS ===
variations:
  - "Different ER lookback (5, 14, 21)"
  - "KAMA(10,5,30) faster fast bound"
  - "ER threshold 0.20 or 0.40"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - SC^2 in the formula — many naïve implementations omit the squaring;
    that produces a very different curve. Apply the square as published.
  - Initial KAMA = SMA(close, ER_period); some platforms initialise
    differently.
look_ahead_bias_warnings: "Standard close-of-day signal."
survivorship_bias_warnings: "Material on stocks."
data_snooping_warnings: "10/2/30 are author defaults; sweep robustness."

