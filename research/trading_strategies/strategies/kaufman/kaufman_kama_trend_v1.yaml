  time_stop: NOT_SPECIFIED
  trailing_stop: "Trail behind KAMA"
  signal_reversal: "Exit when KAMA slope changes sign"
  exit_priority: "Stop → KAMA reversal → trailing"
  exit_price: market_or_stop

