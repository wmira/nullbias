  starting_capital: 100000
  commission_assumption: "$0 retail or per-contract"
  slippage_assumption: "5-10 bps"

# === REPORTED PERFORMANCE ===
author_reported_results:
  test_period: "Multiple decades"
  test_universe: "Diverse"
  cagr: NOT_SPECIFIED
  sharpe: NOT_SPECIFIED
  max_dd: NOT_SPECIFIED
  win_rate: NOT_SPECIFIED
  avg_win_loss_ratio: NOT_SPECIFIED
  num_trades: NOT_SPECIFIED
  notes: "Adaptive width avoids the over-trading problem of fixed-width Bollinger or Donchian channels in volatile regimes."

# === KNOWN VARIATIONS ===
variations:
  - "Use stdev-based instead of ATR-based channel"
  - "Different K values"
  - "Combine with KAMA for smoothed mid-line"

# === IMPLEMENTATION NOTES ===
ambiguities_and_assumptions: |
  - K mapping (1.5 / 2 / 3) is heuristic; document and sweep.
  - ATR ratio threshold (1.5×) for vol regime is heuristic.
look_ahead_bias_warnings: "Standard."
