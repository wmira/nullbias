strategy_id: kaufman_efficiency_ratio_filter_v1
name: "Efficiency Ratio Regime Filter Overlay"
author: Perry Kaufman

source:
  type: book
  title: "Smarter Trading"
  chapter_or_url: "Efficiency Ratio chapter"
  publication_year: 1995
  page_or_section: "ER chapter"

# === STRATEGY METADATA ===
category: factor
sub_category: regime_filter_overlay_efficiency_ratio
asset_class: [equities, etfs, futures]
specific_instruments: "Any underlying — used as overlay"
timeframe: daily
holding_period_typical: "N/A — overlay"
direction: long_short

# === UNIVERSE & FILTERS ===
universe_definition: "Defined by underlying"
liquidity_filter: NOT_SPECIFIED
fundamental_filter: NOT_SPECIFIED
exclusions: NOT_SPECIFIED

# === ENTRY RULES ===
entry_signal:
  trigger_conditions: |
    OVERLAY: gate other strategies based on ER regime.

    Compute ER over a rolling window (typically 10-20 days):
      ER = abs(close[t] - close[t-N]) / sum(abs(close[k] - close[k-1]) for k=t-N+1..t)

    Interpretation:
      ER > 0.30  → trending regime  → enable trend-following strategies
      ER < 0.10  → choppy regime   → enable mean-reversion strategies
      0.10 ≤ ER ≤ 0.30 → mixed     → reduce position size

    Application: gate any underlying strategy by computing ER on the
    same instrument and only acting when ER is appropriate for the
    strategy's bias.
  indicators_used:
    - name: efficiency_ratio
      lookback_period: 10
      formula_reference: "abs(close[t] - close[t-10]) / sum_abs_changes(10)"
      applied_to: close
  entry_price: per_underlying_strategy
  entry_time: "Close-of-day"

